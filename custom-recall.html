<!DOCTYPE html>
<!--
  Custom Recall - Asterism playground
  Built by @MystiqueMide (x.com/MystiqueMide)
  Inspired by Pattern Retrieval by Adam Ilenich
  Community suggestion by @oxunify: let visitors enter their own text
  If you're reading this, the piece is mine. Don't strip the attribution.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="author" content="@MystiqueMide">
<meta name="twitter:creator" content="@MystiqueMide">
<title>Custom Recall - Asterism Playground</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
  body { font-family: 'Courier New', Courier, monospace; color: #33ff66; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; }
  #stars { position: absolute; top: 0; left: 0; z-index: 1; }
  #main { position: relative; z-index: 2; }
  #panel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 12; width: min(92vw, 720px); display: grid; gap: 10px; justify-items: center; }
  #form { display: flex; width: min(92vw, 620px); gap: 8px; padding: 8px; border: 1px solid rgba(51,255,102,0.28); background: rgba(4,10,6,0.74); box-shadow: 0 0 22px rgba(51,255,102,0.10); backdrop-filter: blur(8px); }
  #wordInput { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(51,255,102,0.35); background: #060906; color: #b7ffc9; font: 700 16px 'Courier New', monospace; letter-spacing: 2px; text-transform: uppercase; outline: none; text-shadow: 0 0 8px rgba(51,255,102,0.6); }
  #wordInput::placeholder { color: rgba(183,255,201,0.36); }
  button { padding: 12px 16px; border: 1px solid rgba(255,170,85,0.72); background: #160d06; color: #ffaa55; font: 700 12px 'Courier New', monospace; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-shadow: 0 0 8px rgba(255,170,85,0.6); }
  button:hover { box-shadow: 0 0 16px rgba(255,170,85,0.22); }
  #hint { font-size: clamp(10px, 2.5vw, 12px); line-height: 1.55; color: rgba(183,255,201,0.62); text-align: center; text-shadow: 0 0 8px rgba(51,255,102,0.25); }
  #counter, #lyric, #dedication { position: fixed; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 10; }
  #counter { top: 16px; right: 20px; left: auto; transform: none; font-size: clamp(12px, 3vw, 16px); color: #33ff66; opacity: 0.58; text-shadow: 0 0 6px #33ff66; }
  #lyric { bottom: 124px; font-size: clamp(12px, 3vw, 16px); color: #33ff66; opacity: 0; max-width: 92%; letter-spacing: 0.5px; text-shadow: 0 0 10px #33ff66, 0 0 24px #33ff66; transition: opacity 1.2s; }
  #dedication { top: 46px; font-size: clamp(10px, 2.5vw, 13px); color: #ffaa55; opacity: 0.72; letter-spacing: 1px; text-shadow: 0 0 8px #ffaa55, 0 0 18px #ffaa55; }
  #toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 14; opacity: 0; color: #ffaa55; font-size: 12px; text-align: center; transition: opacity 0.25s; text-shadow: 0 0 12px #ffaa55; }
  @media (max-width: 560px) {
    #form { flex-direction: column; }
    button { width: 100%; }
    #lyric { bottom: 166px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars"></canvas>
  <canvas id="main"></canvas>
  <div id="counter"></div>
  <div id="dedication">CUSTOM RECALL - BUILT BY @MYSTIQUEMIDE</div>
  <div id="lyric"></div>
  <div id="toast"></div>
</div>
<div id="panel">
  <form id="form" autocomplete="off">
    <input id="wordInput" maxlength="14" inputmode="latin" spellcheck="false" placeholder="TYPE WORD" aria-label="Text to recall">
    <button type="submit">Recall</button>
  </form>
  <div id="hint">Type up to 14 letters or numbers. The text dissolves into noise, then retrieves itself across 8 recall passes.</div>
</div>
<script>
/* ================================================================
   CUSTOM RECALL - Asterism playground
   User supplied text becomes the stored pattern.
   Efficient single-memory Hopfield-style recall with CRT phosphor.
   ================================================================ */

const GRID_W = 168, GRID_H = 42, PX = 4;
const BW = GRID_W * PX, BH = GRID_H * PX;
const N = GRID_W * GRID_H;
const vw = window.innerWidth, vh = window.innerHeight;
const SCALE = Math.max(1.5, Math.min(vw * 0.98 / BW, vh * 0.78 / BH, 4.5));
const CW = Math.floor(BW * SCALE), CH = Math.floor(BH * SCALE);
const TP = 8, TPP = 44, CT = 78, LAMBDA = 0.34;

const main = document.getElementById('main'), stars = document.getElementById('stars');
const ctx = main.getContext('2d'), sctx = stars.getContext('2d');
const buf = document.createElement('canvas'), btx = buf.getContext('2d');
const raster = document.createElement('canvas'), rtx = raster.getContext('2d');
main.width = stars.width = CW; main.height = stars.height = CH;
buf.width = BW; buf.height = BH;
raster.width = GRID_W; raster.height = GRID_H;
main.style.cssText = 'width:100vw;height:78vh;image-rendering:pixelated;display:block';
stars.style.cssText = 'width:100vw;height:78vh;image-rendering:pixelated;display:block';

const counterEl = document.getElementById('counter');
const lyricEl = document.getElementById('lyric');
const toastEl = document.getElementById('toast');
const inputEl = document.getElementById('wordInput');
const formEl = document.getElementById('form');

let stored = new Float64Array(N);
let cur = new Float64Array(N);
let activeBits = 0;
let word = 'SIGNAL';
let pass = 0, tick = 0, converged = false, phase = 'corrupt';
let ac = null;
let cleared = false;

const EB = [311.13,349.23,392.00,415.30,466.16,523.25,587.33,622.25,698.46,783.99,880.00,932.33];
const PHRASES = [
  'your word enters the static',
  'memory accepts a new shape',
  'noise begins to answer',
  'the glyph repairs itself',
  'signal wins slowly',
  'retrieval is a ritual',
  'custom pattern stabilized',
  'the system remembers you'
];

function sanitize(value) {
  return value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 14);
}

function initAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, dur, vol = 0.04, type = 'sine') {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(1e-4, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function wash() {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = 49 + word.length * 4;
  g.gain.setValueAtTime(0.02, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(1e-4, ac.currentTime + 2.8);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 2.8);
}
function bleep(n) { tone(EB[(n + word.length) % EB.length], 0.2, 0.034, 'square'); }
function chime() { if (!ac) return; [0,2,4,7,9].forEach((idx,i) => setTimeout(() => tone(EB[(idx + word.length) % EB.length],1.5,0.044,'sine'), i*95)); }

function buildPattern(text) {
  rtx.fillStyle = '#000';
  rtx.fillRect(0, 0, GRID_W, GRID_H);
  const size = text.length <= 5 ? 30 : text.length <= 8 ? 26 : text.length <= 11 ? 21 : 17;
  rtx.font = '900 ' + size + 'px Courier New, monospace';
  rtx.textAlign = 'center';
  rtx.textBaseline = 'middle';
  rtx.fillStyle = '#fff';
  rtx.fillText(text, GRID_W / 2, GRID_H / 2 + 1, GRID_W - 8);
  const img = rtx.getImageData(0, 0, GRID_W, GRID_H).data;
  const out = new Float64Array(N);
  let on = 0;
  for (let i = 0; i < N; i++) {
    const v = img[i * 4 + 3] > 20 && img[i * 4] > 24 ? 1 : -1;
    out[i] = v;
    if (v === 1) on++;
  }
  stored = out;
  activeBits = on;
}

function overlap(vec) {
  let m = 0;
  for (let i = 0; i < N; i++) if (vec[i] === stored[i]) m++;
  return m / N;
}
function corrupt(vec, frac) {
  const out = new Float64Array(vec);
  for (let i = 0; i < N; i++) if (Math.random() < frac) out[i] = -out[i];
  return out;
}
function recallTick(vec) {
  const next = new Float64Array(vec);
  const ol = overlap(next);
  const confidence = Math.max(-1, Math.min(1, (ol - 0.5) * 2));
  const batch = Math.max(64, Math.floor(N * 0.08));
  for (let k = 0; k < batch; k++) {
    const i = Math.floor(Math.random() * N);
    const field = stored[i] * confidence + LAMBDA * stored[i] + (Math.random() - 0.5) * 0.42;
    next[i] = field >= 0 ? 1 : -1;
  }
  return next;
}

const starPool = [];
for (let i = 0; i < 120; i++) {
  starPool.push({ x: Math.random() * CW, y: Math.random() * CH, r: Math.random() * 1.2 + 0.45, phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.03 + 0.01, base: Math.random() * 0.28 + 0.08 });
}
function drawStars(brightness) {
  sctx.clearRect(0, 0, CW, CH);
  for (const s of starPool) {
    s.phase += s.speed;
    const a = s.base + brightness * (0.55 + 0.45 * Math.sin(s.phase));
    sctx.fillStyle = 'rgba(190,225,255,' + Math.min(1, a) + ')';
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r + brightness * 2.4, 0, Math.PI * 2); sctx.fill();
  }
}

function render(vec, color, glowAmount) {
  btx.fillStyle = '#050505'; btx.fillRect(0, 0, BW, BH);
  btx.fillStyle = color;
  for (let i = 0; i < N; i++) if (vec[i] === 1) btx.fillRect((i % GRID_W) * PX, Math.floor(i / GRID_W) * PX, PX, PX);
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, CW, CH);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, CW, CH);
  if (glowAmount > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.08 + glowAmount * 0.24;
    ctx.filter = 'blur(' + (1.2 + glowAmount * 6) + 'px)';
    ctx.drawImage(buf, 0, 0, CW, CH);
    ctx.filter = 'none';
    ctx.restore();
  }
  for (let y = 0; y < CH; y += 3) { ctx.fillStyle = 'rgba(0,0,0,0.11)'; ctx.fillRect(0, y, CW, 1); }
  const cx = CW / 2, cy = CH / 2;
  const vg = ctx.createRadialGradient(cx, cy, CW * 0.3, cx, cy, CW * 0.76);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.58)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, CW, CH);
  if (Math.random() < 0.035) { ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fillRect(0, Math.random() * CH, CW, 1 + Math.random() * 2); }
}

function showPhrase(i) {
  lyricEl.textContent = PHRASES[i % PHRASES.length];
  lyricEl.style.opacity = '0.82';
  setTimeout(() => { lyricEl.style.opacity = '0'; }, 2300);
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  setTimeout(() => { toastEl.style.opacity = '0'; }, 1600);
}
function clearAll() {
  cleared = true;
  word = '';
  stored = new Float64Array(N);
  cur = new Float64Array(N);
  activeBits = 0;
  pass = 0; tick = 0; converged = false; phase = 'corrupt';
  lyricEl.textContent = ''; lyricEl.style.opacity = '0';
  counterEl.textContent = '';
  toastEl.textContent = ''; toastEl.style.opacity = '0';
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, CW, CH);
  sctx.clearRect(0, 0, CW, CH);
}
function reset(nextWord = word) {
  cleared = false;
  word = sanitize(nextWord);
  buildPattern(word);
  cur = Float64Array.from(stored);
  pass = 0; tick = 0; converged = false; phase = 'corrupt';
  lyricEl.style.opacity = '0';
  counterEl.textContent = word + ' READY';
  drawStars(0.05);
  render(stored, '#33ff66', 0.08);
}
function update() {
  if (cleared) return;
  tick++;
  if (phase === 'corrupt') {
    const frac = Math.min(tick / CT, 1) * 0.58;
    cur = corrupt(stored, frac);
    counterEl.textContent = word + '  ' + Math.round(frac * 100) + '% NOISE';
    if (tick === 34) { showPhrase(0); wash(); }
    if (tick >= CT) { phase = 'recall'; tick = 0; counterEl.textContent = 'PASS 0/' + TP; drawStars(0.08); }
  } else if (phase === 'recall') {
    cur = recallTick(cur);
    const p = Math.floor(tick / TPP);
    if (p > pass && p <= TP) {
      pass = p; counterEl.textContent = 'PASS ' + pass + '/' + TP; bleep(pass);
      if ([2,4,6].includes(pass)) showPhrase(pass / 2);
    }
    const ol = overlap(cur); drawStars(ol * 0.72);
    if (!converged && ol > 0.93) {
      converged = true; chime(); drawStars(0.78); showPhrase(6);
    }
    if (pass >= TP && tick > TP * TPP + 40) {
      cur = Float64Array.from(stored); phase = 'complete'; tick = 0; converged = true; counterEl.textContent = word + ' RECALLED'; drawStars(0.86); chime();
    }
  } else if (tick > 260) {
    reset(word);
  }
  let color, glow;
  if (converged || phase === 'complete') { color = '#ffaa55'; glow = 0.32; }
  else if (phase === 'corrupt') { color = tick / CT < 0.5 ? '#33ff66' : '#66ff88'; glow = 0.06; }
  else { const t = Math.min(pass / TP, 1); const r = 51 + t * 204, g = 255 - t * 85, b = 102 - t * 68; color = '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); glow = 0.1 + t * 0.22; }
  render(cur, color, glow);
}

formEl.addEventListener('submit', (event) => {
  event.preventDefault();
  initAudio();
  const next = sanitize(inputEl.value);
  if (!next) {
    clearAll();
    return;
  }
  inputEl.value = next;
  reset(next);
  toast('recalling ' + next);
});
inputEl.addEventListener('focus', () => { inputEl.select(); });
inputEl.addEventListener('click', () => { inputEl.select(); });
inputEl.addEventListener('input', () => {
  const start = inputEl.selectionStart;
  inputEl.value = sanitize(inputEl.value);
  inputEl.setSelectionRange(Math.min(start, inputEl.value.length), Math.min(start, inputEl.value.length));
});
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

reset('SIGNAL');
setInterval(update, 1000 / 30);
console.log('☆ CUSTOM RECALL - Asterism playground');
console.log('Built by @MystiqueMide  |  x.com/MystiqueMide');
console.log('Community suggestion by @oxunify');
console.log('Grid: ' + GRID_W + 'x' + GRID_H + ' = ' + N + ' cells  |  SCALE=' + SCALE.toFixed(2));
console.log('Current word: ' + word + '  |  active bits: ' + activeBits + '  |  lambda=' + LAMBDA);
</script>
</body>
</html>
