<!DOCTYPE html>
<!--
  Signal Retrieved From Noise
  Built by @MystiqueMide (x.com/MystiqueMide)
  Inspired by Pattern Retrieval by Adam Ilenich
  Hopfield-style recall · CRT phosphor · generative audio
  If you're reading this, the piece is mine. Don't strip the attribution.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="author" content="@MystiqueMide">
<meta name="twitter:creator" content="@MystiqueMide">
<title>Signal Retrieved From Noise</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
  body { font-family: 'Courier New', Courier, monospace; cursor: pointer; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; }
  #lyric, #dedication, #counter { position: fixed; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 10; }
  #counter { top: 16px; right: 20px; left: auto; transform: none; font-size: clamp(12px, 3vw, 16px); color: #33ff66; opacity: 0.5; text-shadow: 0 0 6px #33ff66; }
  #lyric { bottom: 28px; font-size: clamp(13px, 3.5vw, 18px); color: #33ff66; opacity: 0; max-width: 92%; letter-spacing: 0.5px; text-shadow: 0 0 10px #33ff66, 0 0 20px #33ff66, 0 0 40px #33ff66; transition: opacity 1.5s; }
  #dedication { bottom: 64px; font-size: clamp(12px, 3vw, 16px); color: #ffaa55; opacity: 0; letter-spacing: 1px; text-shadow: 0 0 8px #ffaa55, 0 0 16px #ffaa55, 0 0 32px #ffaa55; transition: opacity 2s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars"></canvas>
  <canvas id="main"></canvas>
  <div id="counter"></div>
  <div id="lyric"></div>
  <div id="dedication"></div>
</div>
<script>
/* ================================================================
   ASTERISM - Signal Retrieved From Noise
   Hopfield-style recall retrieving "ASTERISM" from noise.
   CRT phosphor treatment. Generative audio follows recall state.
   ================================================================ */

const CHAR_W = 12, CHAR_H = 18, GAP = 4, PX = 5;
const WORD = "ASTERISM";
const GW = WORD.length * CHAR_W + (WORD.length - 1) * GAP;
const N = GW * CHAR_H;
const BW = GW * PX, BH = CHAR_H * PX;

// Full-screen: render at high res, let CSS stretch to fill viewport
const vw = window.innerWidth, vh = window.innerHeight;
const SCALE = Math.max(4.0, Math.min(vw * 0.96 / BW, vh * 0.88 / BH, 6.5));
const CW = Math.floor(BW * SCALE), CH = Math.floor(BH * SCALE);

const main = document.getElementById('main'), stars = document.getElementById('stars');
main.width = CW; main.height = CH;
stars.width = CW; stars.height = CH;
// Fill viewport: width fills screen, height fills most of the screen (stretched pixel art)
main.style.cssText = 'width:100vw;height:80vh;image-rendering:pixelated;display:block';
stars.style.cssText = 'width:100vw;height:80vh;image-rendering:pixelated;display:block;position:absolute;top:0;left:0';
const ctx = main.getContext('2d'), sctx = stars.getContext('2d');
const buf = document.createElement('canvas');
buf.width = BW; buf.height = BH;
const btx = buf.getContext('2d');

const counterEl = document.getElementById('counter'), lyricEl = document.getElementById('lyric'), dedEl = document.getElementById('dedication');

// ── Bitmap font ──────────────────────────────────────────────
const FONT = {
  A: ['.....##.....','....####....','...##.##....','..##..##....','..##..##....','.########...','.##....##...','.##....##...','.##....##...','.##....##...'],
  S: ['..######....','.##....##...','.##.........','.#######....','..######....','.......##...','.##....##...','..######....'],
  T: ['.########...','...##.......','...##.......','...##.......','...##.......','...##.......','...##.......','...##.......'],
  E: ['.########...','.##.........','.##.........','.######.....','.##.........','.##.........','.########...'],
  R: ['.########...','.##....##...','.##....##...','.########...','.##..##.....','.##...##....','.##....##...'],
  I: ['..####......','...##.......','...##.......','...##.......','...##.......','...##.......','...##.......','..####......'],
  M: ['.##....##...','.###..###...','.########...','.##.##.##...','.##.##.##...','.##....##...','.##....##...','.##....##...','.##....##...','.##....##...','.##....##...','.##....##...'],
};

function glyph(ch) {
  const rows = FONT[ch] || FONT['E'];
  const grid = Array.from({length: CHAR_H}, () => new Float64Array(CHAR_W));
  const oy = Math.floor((CHAR_H - rows.length) / 2);
  for (let y = 0; y < rows.length; y++) {
    const ox = Math.floor((CHAR_W - rows[y].length) / 2);
    for (let x = 0; x < rows[y].length; x++) if (rows[y][x] === '#') grid[oy + y][ox + x] = 1;
  }
  return grid;
}

// ── Stored pattern + Hebbian weights ────────────────────────
const stored = new Float64Array(N);
for (let ci = 0; ci < WORD.length; ci++) {
  const g = glyph(WORD[ci]), col0 = ci * (CHAR_W + GAP);
  for (let y = 0; y < CHAR_H; y++) for (let x = 0; x < CHAR_W; x++) if (g[y][x]) stored[y * GW + col0 + x] = 1;
}
for (let i = 0; i < N; i++) if (stored[i] === 0) stored[i] = -1;
const onBits = stored.reduce((a, v) => a + (v === 1 ? 1 : 0), 0);

const W = new Float64Array(N * N);
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) W[i * N + j] = (i === j) ? 0 : stored[i] * stored[j] / N;

// ── Async recall ─────────────────────────────────────────────
const BATCH = Math.max(1, Math.floor(N * 0.06));
const LAMBDA = 0.35;

function recallTick(vec) {
  const next = new Float64Array(vec);
  for (let k = 0; k < BATCH; k++) {
    const i = Math.floor(Math.random() * N);
    let h = 0;
    for (let j = 0; j < N; j++) h += W[i * N + j] * next[j];
    next[i] = (h + LAMBDA * stored[i]) > 0 ? 1 : -1;
  }
  return next;
}

function overlap(vec) { let m = 0; for (let i = 0; i < N; i++) if (vec[i] === stored[i]) m++; return m / N; }
function corrupt(vec, frac) { const out = new Float64Array(vec); for (let i = 0; i < N; i++) if (Math.random() < frac) out[i] = -out[i]; return out; }

// ── Audio: generative recall score ───────────────────────────
const EB = [311.13,349.23,392.00,415.30,466.16,523.25,587.33,622.25,698.46,783.99,880.00,932.33];
let ac = null;
function initAudio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, vol = 0.05, type = 'sine') {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(1e-4, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function wash() { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = 55; g.gain.setValueAtTime(0.022, ac.currentTime); g.gain.exponentialRampToValueAtTime(1e-4, ac.currentTime + 3); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 3); }
function bleep(n) { tone(EB[n % EB.length], 0.22, 0.035, 'square'); }
function chime() { if (!ac) return; [EB[0],EB[2],EB[4],EB[7],EB[9]].forEach((f,i) => setTimeout(() => tone(f,1.6,0.045,'sine'), i*100)); }

// ── Signal phrases ───────────────────────────────────────────
const PHRASES = ["signal under the noise","memory leaves residue","the field starts answering","pattern pulled from static","recall is never clean","structure returns in fragments","noise gives up the shape","the system remembers badly"];
function showPhrase(i) { lyricEl.textContent = PHRASES[i % PHRASES.length]; lyricEl.style.opacity = '0.82'; setTimeout(() => { lyricEl.style.opacity = '0'; }, 2600); }

// ── Star particles (bigger) ────────────────────────────────
const starPool = [];
for (let i = 0; i < 100; i++) starPool.push({ x: Math.random() * CW, y: Math.random() * CH, r: Math.random() * 1.4 + 0.5, phase: Math.random() * Math.PI * 2, speed: Math.random() * 0.03 + 0.01, base: Math.random() * 0.3 + 0.1 });
function drawStars(brightness) {
  sctx.clearRect(0, 0, CW, CH);
  for (const s of starPool) { s.phase += s.speed; const a = s.base + brightness * (0.5 + 0.5 * Math.sin(s.phase)); sctx.fillStyle = 'rgba(180,220,255,' + Math.min(1, a) + ')'; sctx.beginPath(); sctx.arc(s.x, s.y, s.r + brightness * 2.2, 0, Math.PI * 2); sctx.fill(); }
}

// ── CRT render (NO chromatic aberration to avoid ghosting) ──
function render(vec, color, glowAmount) {
  btx.fillStyle = '#050505'; btx.fillRect(0, 0, BW, BH);
  for (let i = 0; i < N; i++) if (vec[i] === 1) { btx.fillStyle = color; btx.fillRect((i % GW) * PX, Math.floor(i / GW) * PX, PX, PX); }
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, CW, CH);
  // Draw buffer directly (no barrel warp, no aberration - clean pixel text)
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, CW, CH);
  // Phosphor glow
  if (glowAmount > 0.01) { 
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.08 + glowAmount * 0.25; 
    ctx.filter = 'blur(' + (1.2 + glowAmount * 6) + 'px)'; ctx.drawImage(buf, 0, 0, CW, CH); ctx.filter = 'none'; ctx.restore(); 
  }
  // Scanlines
  for (let y = 0; y < CH; y += 3) { ctx.fillStyle = 'rgba(0,0,0,0.10)'; ctx.fillRect(0, y, CW, 1); }
  // Soft vignette
  const cx = CW / 2, cy = CH / 2;
  const vg = ctx.createRadialGradient(cx, cy, CW * 0.35, cx, cy, CW * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, CW, CH);
  // Occasional flicker
  if (Math.random() < 0.035) { ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0, Math.random() * CH, CW, 1 + Math.random() * 2); }
}

// ── State machine ────────────────────────────────────────────
const TP = 8, TPP = 55, CT = 90;
let cur, pass, tick, converged, phase;
function reset() { cur = Float64Array.from(stored); pass = 0; tick = 0; converged = false; phase = 'corrupt'; dedEl.style.opacity = '0'; lyricEl.style.opacity = '0'; counterEl.textContent = ''; drawStars(0); render(stored, '#33ff66', 0); }
function update() {
  tick++;
  if (phase === 'corrupt') {
    const frac = Math.min(tick / CT, 1) * 0.55; cur = corrupt(stored, frac); counterEl.textContent = Math.round(frac * 100) + '% noise';
    if (tick === 45) { showPhrase(0); wash(); }
    if (tick >= CT) { phase = 'recall'; tick = 0; counterEl.textContent = 'PASS 0/' + TP; drawStars(0.05); }
  } else if (phase === 'recall') {
    cur = recallTick(cur);
    const p = Math.floor(tick / TPP); if (p > pass && p <= TP) { pass = p; counterEl.textContent = 'PASS ' + pass + '/' + TP; bleep(pass); if ([2,4,6].includes(pass)) showPhrase(pass / 2); }
    const ol = overlap(cur); drawStars(ol * 0.65);
    if (!converged && ol > 0.9) { converged = true; chime(); drawStars(0.7); setTimeout(() => { dedEl.textContent = 'built by @MystiqueMide'; dedEl.style.opacity = '1'; }, 1200); }
    if (pass >= TP && converged && tick > TP * TPP + 60) { phase = 'complete'; tick = 0; counterEl.textContent = 'RECALLED'; drawStars(0.8); }
    else if (pass >= TP && !converged && tick > TP * TPP + 120) { cur = Float64Array.from(stored); phase = 'complete'; tick = 0; counterEl.textContent = 'RECALLED'; drawStars(0.8); if (!converged) { chime(); setTimeout(() => { dedEl.textContent = 'built by @MystiqueMide'; dedEl.style.opacity = '1'; }, 1200); converged = true; } }
  } else { if (tick > 300) reset(); }
  let color, glow;
  if (converged) { color = '#ffaa55'; glow = 0.3; } else if (phase === 'corrupt') { color = tick / CT < 0.5 ? '#33ff66' : '#66ff88'; glow = 0.04; }
  else { const t = Math.min(pass / TP, 1); const r = 51 + t * 204, g = 255 - t * 85, b = 102 - t * 68; color = '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); glow = 0.08 + t * 0.22; }
  render(cur, color, glow);
}
function onInteraction() { initAudio(); document.removeEventListener('click', onInteraction); document.removeEventListener('touchstart', onInteraction); }
document.addEventListener('click', onInteraction); document.addEventListener('touchstart', onInteraction);
reset(); setInterval(update, 1000 / 30);
console.log('☆ ASTERISM - Signal Retrieved From Noise');
console.log('Network: ' + N + ' neurons, ' + onBits + ' active, ' + BATCH + '/tick async');
console.log('Pattern: ' + WORD + '  |  \u03bb=' + LAMBDA + '  |  SCALE=' + SCALE.toFixed(2) + '  |  Canvas: ' + CW + 'x' + CH);
console.log('Generative recall score follows corruption, pass count, and convergence');
console.log('Built by @MystiqueMide  |  x.com/MystiqueMide');
</script>
</body>
</html>
